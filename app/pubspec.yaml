name: carpool
description: "CarPool — студенческий райдшеринг: поиск попутчиков и бронирование мест."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Versions are pinned exactly: the build must be reproducible across machines.
dependencies:
  flutter:
    sdk: flutter
  # Russian Material strings and the date / time pickers (from L3).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8

  # Typography: Unbounded and Golos Text are fetched through google_fonts.
  google_fonts: 8.2.1

  # Navigation (wired up from L3).
  go_router: 18.0.1

  # State management (wired up from L4).
  flutter_riverpod: 3.4.3

  # HTTP client for the backend integration (from L5).
  dio: 5.11.1

  # Local storage: recent searches cache and the JWT.
  shared_preferences: 2.5.5
  flutter_secure_storage: 11.2.0

  # Date and price formatting.
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
